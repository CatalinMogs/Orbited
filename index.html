<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Orbited</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Orbited</h1>

        <canvas id="universe">

        </canvas>

        <div>
            <label for="mass">Planet mass:</label>
            <input type="number" id="mass" value="100">
        </div>

        <div>
            <label for="velocityX">Velocity X:</label>
            <input type="number" id="velocityX" value="0" step="0,1">

            <label for="velocityY">Velocity Y:</label>
            <input type="number" id="velocityY" value="0" step="0.1">
        </div>

        <div>
            <button id="pause">Pause</button>
            <button id="reset">Reset</button>
        </div>

        <script src="script.js"></script>
    </body>
</html>
