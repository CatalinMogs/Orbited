<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Orbited</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Orbited</h1>
            <p>Newton Gravity Simulator</p>
        </header>

        <main>
            <section class="simulation">
                <canvas id="universe"></canvas>
            </section>

            <section class="controls">
                <h2>Planet controls</h2>

                <div>
                    <label for="mass">Planet mass:</label>
                    <input type="number" id="mass" value="100">
                </div>


                <div>
                    <label for="velocityX">Velocity X:</label>
                    <input type="number" id="velocityX" value="0" step="0.1">

                    <label for="velocityY">Velocity Y:</label>
                    <input type="number" id="velocityY" value="0" step="0.1">
                </div>

                <div>
                    <button id="pause">Pause</button>
                    <button id="reset">Reset</button>
                </div>
            </section>
        </main>

        <script src="script.js"></script>
    </body>
</html>
